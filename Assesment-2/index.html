<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Practice</title>
  </head>

  <body>
    <form method="post">
      <div class="first">
        <h1>Enter Your Details</h1>

        <label for="firstname">Enter Your FirstName</label>
        <input
          type="text"
          name="firstname"
          id="firstname"
          required
          minlength="3"
          maxlength="10"
        >

        <label for="middlename">Enter Your MiddleName</label>
        <input type="text" name="middlename" id="middlename">

        <label for="lastname">Enter Your LastName</label>
        <input
          type="text"
          name="lastname"
          id="lastname"
          required
          minlength="3"
          maxlength="10"
        >

        <label for="password">Enter Your Password</label>
        <input
          type="password"
          name="password"
          id="password"
          required
          minlength="3"
          maxlength="10"
        >

        <label for="email">Enter Your Email</label>
        <input
          type="email"
          name="email"
          id="email"
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}"
        >

        <label for="address">Enter Your Current Address</label>
        <textarea name="address" id="address"></textarea>

        <label for="contact">Enter Your Contact Detail</label>
        <input type="number" name="contact" id="contact" required>

        <label for="age">Enter Your Age</label>
        <input
          type="number"
          name="age"
          id="age"
          min="18"
          max="100"
          required
        >

        <fieldset>
          <legend>Select Your Gender</legend>

          <input
            type="radio"
            name="gender"
            id="male"
            value="male"
            required
          >
          <label for="male">Male</label>

          <input
            type="radio"
            name="gender"
            id="female"
            value="female"
          >
          <label for="female">Female</label>

          <input
            type="radio"
            name="gender"
            id="other"
            value="other"
          >
          <label for="other">Other</label>
        </fieldset>

        <fieldset>
          <legend>Select Your Age Group</legend>

          <input
            type="radio"
            name="ageGroup"
            id="youngAdult"
            value="18-25"
          >
          <label for="youngAdult">18 - 25</label>

          <input
            type="radio"
            name="ageGroup"
            id="adult"
            value="26-40"
          >
          <label for="adult">26 - 40</label>

          <input
            type="radio"
            name="ageGroup"
            id="middleAge"
            value="41-60"
          >
          <label for="middleAge">41 - 60</label>

          <input
            type="radio"
            name="ageGroup"
            id="senior"
            value="61+"
          >
          <label for="senior">61+</label>
        </fieldset>

        <fieldset>
          <legend>Select Your Preferred Languages</legend>

          <input
            type="checkbox"
            name="language"
            id="java"
            value="java"
          >
          <label for="java">Java</label>

          <input
            type="checkbox"
            name="language"
            id="javascript"
            value="javascript"
          >
          <label for="javascript">JavaScript</label>

          <input
            type="checkbox"
            name="language"
            id="python"
            value="python"
          >
          <label for="python">Python</label>

          <input
            type="checkbox"
            name="language"
            id="cpp"
            value="cpp"
          >
          <label for="cpp">C++</label>
        </fieldset>

        <label for="DOB">Select DOB</label>
        <input type="date" name="DOB" id="DOB">

        <label for="range">Select Price Range</label>
        <input
          type="range"
          name="range"
          id="range"
          min="100"
          max="5000"
        >

        <label for="country">Select Your Country</label>
        <select name="country" id="country">
          <optgroup label="Asia">
            <option value="india">India</option>
            <option value="japan">Japan</option>
            <option value="china">China</option>
          </optgroup>

          <optgroup label="Europe">
            <option value="germany">Germany</option>
            <option value="france">France</option>
            <option value="italy">Italy</option>
          </optgroup>
        </select>

        <label for="resume">Add Your Resume</label>
        <input type="file" name="resume" id="resume" required>
      </div>

      <button type="submit" name="submit">Submit</button>
    </form>
  </body>
</html>
